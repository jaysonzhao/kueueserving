---
# ServiceAccount for Tenant Quota Management Pipeline (Admin)
# Used by cluster admins to create ClusterQueues and ResourceFlavors
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quota-management-pipeline-sa
  namespace: openshift-pipelines
---
# ServiceAccount for Model Deployment Pipeline (Developer)
# Used to create LocalQueues and Deployments/InferenceServices
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-deployment-pipeline-sa
  namespace: openshift-pipelines
